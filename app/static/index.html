<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多智能体营销分析</title><style>body{max-width:980px;margin:2rem auto;padding:0 1rem;font:15px/1.6 system-ui;color:#172033}textarea,input{width:100%;box-sizing:border-box;margin:.35rem 0 1rem;padding:.65rem;border:1px solid #cbd5e1;border-radius:6px}textarea{min-height:8rem;font-family:monospace}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:.7rem 1.1rem;cursor:pointer}pre{background:#f8fafc;padding:1rem;overflow:auto;border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}</style></head><body><h1>多智能体数据处理与营销策略</h1><p>主控会自动优化 prompt、筛选数据、分派任务并记录 trace；结果文件在 storage/ 中保留 7 天。</p><div class="grid"><label>项目名称<input id="project" value="本地营销分析"></label><label>产品模式<select id="mode"><option value="offline">线下产品</option><option value="online">线上产品</option></select></label></div><label>分析要求<input id="request" value="分析销售趋势并给出下一周期营销策略"></label><label>数据（JSON 数组）<textarea id="data">[{"date":"2026-01-01","product":"A","channel":"线上","amount":1200,"quantity":10},{"date":"2026-01-02","product":"B","channel":"门店","amount":800,"quantity":8}]</textarea></label><button id="run">开始分析</button><h2>结果</h2><pre id="result">等待运行…</pre><script>document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');out.textContent='运行中…';try{const body={project_name:document.getElementById('project').value,request:document.getElementById('request').value,product_mode:document.getElementById('mode').value,data:JSON.parse(document.getElementById('data').value)};const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};</script></body></html>
